<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <title>Mis Tareas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#f9fafb;font-family:system-ui,-apple-system,sans-serif;}
    @keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
    @keyframes bb{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOQ0zUilpzUaKbSmr5EpJj6TXZngw-_0sTYoO-LAuUQFFqUr1ka2nFyTpdoD8H4swUQCkwTbq6sGKa/pub?gid=0&single=true&output=csv";
const WEBHOOK = "https://script.google.com/macros/s/AKfycbzrRgSW0lN_AK9m6McbauHo4-azpQrN3E1VRZyxz01Mpbc0_6B9V7JNcRVr5mP4UY0V6Q/exec";

const PC = { Alta:{bg:"#fef2f2",c:"#b91c1c",dot:"#ef4444"}, Media:{bg:"#fffbeb",c:"#92400e",dot:"#f59e0b"}, Baja:{bg:"#f0fdf4",c:"#166534",dot:"#22c55e"} };
const SC = { Pendiente:{bg:"#eff6ff",c:"#1d4ed8"}, "En Progreso":{bg:"#fffbeb",c:"#92400e"}, Completada:{bg:"#f0fdf4",c:"#166534"}, Cancelada:{bg:"#f3f4f6",c:"#6b7280"} };

function t0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseD(v){ if(!v) return null; const d=new Date(v+"T12:00:00"); return isNaN(d)?null:d; }
function isOv(t){ const d=parseD(t.Fecha_Limite); return d&&d<t0()&&t.Estado!=="Completada"&&t.Estado!=="Cancelada"; }
function isHoy(t){ const d=parseD(t.Fecha_Limite); return d&&d.toDateString()===t0().toDateString()&&t.Estado!=="Completada"; }
function isDone(t){ return t.Estado==="Completada"||t.Estado==="Cancelada"; }

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if(lines.length<2) return [];
  const headers = lines[0].split(",").map(h=>h.replace(/^"|"$/g,"").trim());
  return lines.slice(1).map(line=>{
    const vals=[]; let cur="",inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){inQ=!inQ;}
      else if(ch===','&&!inQ){vals.push(cur.trim());cur="";}
      else{cur+=ch;}
    }
    vals.push(cur.trim());
    const obj={};
    headers.forEach((h,i)=>{obj[h]=(vals[i]||"").replace(/^"|"$/g,"").trim();});
    return obj;
  }).filter(r=>r.ID||r.Titulo);
}

function parseIntent(txt, tasks) {
  const t=txt.toLowerCase(), now=t0();
  const fmt=d=>d.toISOString().split("T")[0];

  const resolveDate=(text)=>{
    const tl=text.toLowerCase();
    if(/mañana/.test(tl)) return fmt(new Date(now.getTime()+86400000));
    if(/\bhoy\b/.test(tl)) return fmt(now);
    const days=["domingo","lunes","martes","miércoles","miercoles","jueves","viernes","sábado","sabado"];
    for(let i=0;i<days.length;i++){
      if(tl.includes(days[i])){const d=new Date(now);const diff=(i-d.getDay()+7)%7||7;d.setDate(d.getDate()+diff);return fmt(d);}
    }
    const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    const m1=text.match(/(\d{1,2})\s+de\s+(\w+)/i);
    if(m1){const mes=meses.indexOf(m1[2].toLowerCase());if(mes>=0)return fmt(new Date(now.getFullYear(),mes,parseInt(m1[1])));}
    const m2=text.match(/\b(\d{1,2})[\/\-](\d{1,2})/);
    if(m2) return fmt(new Date(now.getFullYear(),parseInt(m2[2])-1,parseInt(m2[1])));
    const m3=text.match(/el\s+(\d{1,2})/i);
    if(m3){const d=new Date(now.getFullYear(),now.getMonth(),parseInt(m3[1]));if(d<now)d.setMonth(d.getMonth()+1);return fmt(d);}
    return "";
  };

  const resolvePriority=(text)=>{
    const tl=text.toLowerCase();
    if(/\balta\b|urgente|crítico|directorio|audiencia|junta|sindicato/.test(tl)) return "Alta";
    if(/\bbaja\b/.test(tl)) return "Baja";
    return "Media";
  };

  const resolveCategory=(text)=>{
    const tl=text.toLowerCase();
    if(/directorio|board|junta/.test(tl)) return "Directorio";
    if(/finanzas|financiamiento|presupuesto|banco/.test(tl)) return "Finanzas";
    if(/legal|audiencia|moreno|abogado|contrato/.test(tl)) return "Legal";
    if(/rrhh|rr\.hh|personal|sueldo|expatriado|sindicato|convenio|dpo|warnes/.test(tl)) return "RRHH";
    if(/abastecimiento|proveedor|compra/.test(tl)) return "Abastecimiento";
    if(/\bti\b|tecnolog|sistema|software/.test(tl)) return "TI";
    return "";
  };

  const isUpdate=/complet[eéo]|ya hice|ya mandé|hecho\b|listo\b|cancel[eéo]|en progreso|empecé|terminé/.test(t);
  if(isUpdate){
    let matched=null,maxScore=0;
    for(const task of tasks){
      const words=task.Titulo.toLowerCase().split(/\s+/);
      const score=words.filter(w=>w.length>3&&t.includes(w)).length;
      if(score>maxScore){maxScore=score;matched=task;}
    }
    if(matched&&maxScore>0){
      let newEstado="Completada";
      if(/cancel/.test(t)) newEstado="Cancelada";
      if(/en progreso|empecé/.test(t)) newEstado="En Progreso";
      return {action:"update",tasks:[{ID:matched.ID,Estado:newEstado}],message:`✓ "${matched.Titulo}" → ${newEstado}.`};
    }
    return {action:"none",message:"No encontré esa tarea. Sé más específico."};
  }

  const chunks=txt.split(/[;]|\by también\b|\bademás\b/i).map(s=>s.trim()).filter(Boolean);
  const newTasks=chunks.map(chunk=>({
    Titulo:chunk.replace(/,?\s*(alta|media|baja|prioridad\s*(alta|media|baja)|urgente)/gi,"").replace(/\s+/g," ").trim(),
    Estado:"Pendiente",Prioridad:resolvePriority(chunk),Categoria:resolveCategory(chunk),Fecha_Limite:resolveDate(chunk),Notas:"",
  }));
  const resumen=newTasks.map(t=>`• ${t.Titulo}${t.Fecha_Limite?" ("+t.Fecha_Limite+")":""}  [${t.Prioridad}]`).join("\n");
  return {action:"add",tasks:newTasks,message:`Guardando:\n${resumen}`};
}

function ChatBar({tasks, onSync}){
  const [input,setInput]=React.useState("");
  const [msgs,setMsgs]=React.useState([{r:"a",t:"Escribí una tarea y la guardo en el Sheet. Ej: 'Reunión con Jorge el jueves, alta'"}]);
  const [busy,setBusy]=React.useState(false);
  const [open,setOpen]=React.useState(false);
  const endRef=React.useRef(null);
  React.useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[msgs]);

  const send=async()=>{
    const txt=input.trim(); if(!txt||busy) return;
    setInput(""); setBusy(true);
    setMsgs(m=>[...m,{r:"u",t:txt}]);
    try{
      const result=parseIntent(txt,tasks);
      if(result.action==="none"){setMsgs(m=>[...m,{r:"a",t:result.message}]);setBusy(false);return;}
      const calls=[];
      if(result.action==="add") result.tasks.forEach(t=>calls.push({...t,action:"add"}));
      if(result.action==="update") result.tasks.forEach(t=>calls.push({...t,action:"update"}));
      for(const payload of calls){
        await fetch(WEBHOOK,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)});
      }
      setMsgs(m=>[...m,{r:"a",t:result.message}]);
      if(calls.length) setTimeout(onSync,2000);
    }catch(e){setMsgs(m=>[...m,{r:"a",t:"⚠ Error: "+e.message}]);}
    setBusy(false);
  };

  return (
    <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:100}}>
      {open&&(
        <div style={{maxWidth:520,margin:"0 auto",background:"#fff",borderTop:"0.5px solid #e5e7eb",borderLeft:"0.5px solid #e5e7eb",borderRight:"0.5px solid #e5e7eb",borderRadius:"14px 14px 0 0",padding:"10px 12px 0"}}>
          <div style={{maxHeight:200,overflowY:"auto",paddingBottom:8}}>
            {msgs.map((m,i)=>(
              <div key={i} style={{display:"flex",justifyContent:m.r==="u"?"flex-end":"flex-start",marginBottom:6}}>
                <div style={{maxWidth:"85%",padding:"7px 11px",borderRadius:10,fontSize:13,lineHeight:1.5,whiteSpace:"pre-wrap",
                  background:m.r==="u"?"#111":"#f3f4f6",color:m.r==="u"?"#fff":"#111",
                  borderBottomRightRadius:m.r==="u"?2:10,borderBottomLeftRadius:m.r==="u"?10:2}}>{m.t}</div>
              </div>
            ))}
            {busy&&<div style={{display:"flex",gap:4,padding:"4px 2px"}}>
              {[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:"50%",background:"#d1d5db",animation:`bb 1.2s ease-in-out ${i*.2}s infinite`}}/>)}
            </div>}
            <div ref={endRef}/>
          </div>
        </div>
      )}
      <div style={{maxWidth:520,margin:"0 auto",background:"#fff",borderTop:"0.5px solid #e5e7eb",padding:"8px 12px",display:"flex",gap:8,alignItems:"center"}}>
        <button onClick={()=>setOpen(o=>!o)} style={{background:"#f3f4f6",border:"none",borderRadius:8,padding:"8px 10px",fontSize:16,cursor:"pointer",flexShrink:0}}>
          {open?"↓":"💬"}
        </button>
        <input value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();send();}}}
          placeholder='Ej: "Reunión con Jorge el jueves, alta prioridad"'
          style={{flex:1,border:"0.5px solid #e5e7eb",borderRadius:8,padding:"9px 12px",fontSize:13,fontFamily:"inherit",outline:"none",background:"#fafafa"}}/>
        <button onClick={send} disabled={busy||!input.trim()} style={{
          background:busy||!input.trim()?"#f3f4f6":"#111",color:busy||!input.trim()?"#9ca3af":"#fff",
          border:"none",borderRadius:8,padding:"9px 14px",fontSize:16,cursor:busy||!input.trim()?"default":"pointer"}}>↑</button>
      </div>
    </div>
  );
}

function App(){
  const [tasks,setTasks]=React.useState([]);
  const [loading,setLoad]=React.useState(true);
  const [view,setView]=React.useState("pend");
  const [aiMode,setAiMode]=React.useState("prod");
  const [aiText,setAiText]=React.useState("");
  const [aiLoad,setAiLoad]=React.useState(false);
  const [lastSync,setLastSync]=React.useState(null);

  const fetchTasks=async()=>{
    setLoad(true);
    try{
      const res=await fetch(CSV_URL,{cache:"no-store"});
      setTasks(parseCSV(await res.text()));
      setLastSync(new Date());
    }catch(e){console.error(e);}
    setLoad(false);
  };
  React.useEffect(()=>{fetchTasks();},[]);

  const counts={
    pend:tasks.filter(t=>t.Estado==="Pendiente"||t.Estado==="En Progreso").length,
    hoy:tasks.filter(isHoy).length,
    venc:tasks.filter(isOv).length,
    done:tasks.filter(t=>t.Estado==="Completada").length,
  };
  const pct=tasks.length?Math.round(counts.done/tasks.length*100):0;

  let list=[...tasks];
  if(view==="pend") list=list.filter(t=>t.Estado==="Pendiente"||t.Estado==="En Progreso");
  else if(view==="hoy") list=list.filter(isHoy);
  else if(view==="venc") list=list.filter(isOv);
  else if(view==="done") list=list.filter(t=>t.Estado==="Completada");
  list.sort((a,b)=>{
    const po={Alta:0,Media:1,Baja:2};
    const d=(po[a.Prioridad]??2)-(po[b.Prioridad]??2);
    if(d) return d;
    const da=parseD(a.Fecha_Limite),db=parseD(b.Fecha_Limite);
    return da&&db?da-db:0;
  });

  const toggle=id=>setTasks(prev=>prev.map(t=>String(t.ID)===String(id)?{...t,Estado:isDone(t)?"Pendiente":"Completada"}:t));

  const runAI=async()=>{
    setAiLoad(true);setAiText("");
    const sum=tasks.filter(t=>t.Estado!=="Cancelada")
      .map(t=>`- ${t.Titulo} · ${t.Estado} · ${t.Prioridad}${t.Fecha_Limite?" · vence:"+t.Fecha_Limite:""}`)
      .join("\n");
    const ps={
      prod:"Dame 3 recomendaciones de productividad concretas. Máximo 140 palabras.",
      foco:"¿En qué enfocarme HOY? Orden concreto. Máximo 120 palabras.",
      res:"Resumen ejecutivo: qué está bien, en riesgo y urgente. Máximo 130 palabras.",
    };
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,
          system:"Coach de productividad. Respuestas en español, claras y directas.",
          messages:[{role:"user",content:`Mis tareas:\n${sum}\n\n${ps[aiMode]}`}]})
      });
      const d=await r.json();
      setAiText(d.content?.[0]?.text||"Sin respuesta.");
    }catch{setAiText("Error al conectar.");}
    setAiLoad(false);
  };

  const alerts=[
    ...tasks.filter(isOv).slice(0,3).map(t=>({e:"⚠️",m:`"${t.Titulo}" vencida`})),
    ...tasks.filter(t=>isHoy(t)&&!isOv(t)).slice(0,2).map(t=>({e:"⏰",m:`"${t.Titulo}" vence hoy`})),
  ];

  return (
    <div style={{maxWidth:520,margin:"0 auto",padding:"16px 12px 100px",background:"#f9fafb",minHeight:"100vh"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
        <div>
          <div style={{fontSize:17,fontWeight:700,color:"#111"}}>Mis tareas</div>
          <div style={{fontSize:11,color:"#9ca3af",marginTop:1}}>
            {loading?"Sincronizando...":lastSync?`Sync ${lastSync.toLocaleTimeString("es-BO",{hour:"2-digit",minute:"2-digit"})} · ${tasks.length} tareas`:"Sin datos"}
          </div>
        </div>
        <button onClick={fetchTasks} disabled={loading} style={{background:loading?"#e5e7eb":"#111",color:loading?"#9ca3af":"#fff",border:"none",padding:"8px 14px",borderRadius:10,fontSize:13,fontWeight:600,cursor:loading?"default":"pointer"}}>
          {loading?"...":"↻ Sync"}
        </button>
      </div>

      <div style={{height:4,background:"#e5e7eb",borderRadius:2,margin:"12px 0 16px",overflow:"hidden"}}>
        <div style={{height:"100%",width:pct+"%",background:"#22c55e",borderRadius:2,transition:"width .5s"}}/>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:14}}>
        {[["pend",counts.pend,"#d97706","Pend."],["hoy",counts.hoy,"#111","Hoy"],["venc",counts.venc,"#dc2626","Venc."],["done",counts.done,"#16a34a","Hecho"]].map(([v,n,c,l])=>(
          <div key={v} onClick={()=>setView(v)} style={{padding:"10px 6px",borderRadius:10,textAlign:"center",cursor:"pointer",
            background:view===v?"#111":"#fff",border:`0.5px solid ${view===v?"transparent":"#e5e7eb"}`,transition:"all .15s"}}>
            <div style={{fontSize:20,fontWeight:700,color:view===v?"#fff":c,fontFamily:"monospace"}}>{n}</div>
            <div style={{fontSize:10,color:view===v?"rgba(255,255,255,.6)":"#9ca3af",marginTop:1}}>{l}</div>
          </div>
        ))}
      </div>

      {alerts.length>0&&(
        <div style={{background:"#fffbeb",border:"0.5px solid #fcd34d",borderRadius:10,padding:"10px 12px",marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:"#92400e",textTransform:"uppercase",letterSpacing:"0.4px",marginBottom:6}}>Alertas</div>
          {alerts.map((a,i)=>(
            <div key={i} style={{fontSize:12,color:"#78350f",marginBottom:3,display:"flex",gap:6}}>
              <span>{a.e}</span><span>{a.m}</span>
            </div>
          ))}
        </div>
      )}

      <div style={{background:"#fff",border:"0.5px solid #e5e7eb",borderRadius:12,padding:14,marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div style={{fontSize:13,fontWeight:600,color:"#111"}}>✦ Análisis IA</div>
          <div style={{display:"flex",gap:4}}>
            {[["prod","Produc."],["foco","Hoy"],["res","Resumen"]].map(([m,l])=>(
              <button key={m} onClick={()=>{setAiMode(m);setAiText("");}}
                style={{fontSize:10,padding:"3px 8px",borderRadius:6,cursor:"pointer",border:"0.5px solid #e5e7eb",
                  background:aiMode===m?"#111":"#f8f8f8",color:aiMode===m?"#fff":"#374151",fontFamily:"inherit"}}>{l}</button>
            ))}
          </div>
        </div>
        {!aiText&&!aiLoad&&(
          <div style={{textAlign:"center",padding:"6px 0"}}>
            <div style={{fontSize:12,color:"#9ca3af",marginBottom:10}}>Orientación basada en tus tareas reales</div>
            <button onClick={runAI} style={{background:"#111",color:"#fff",border:"none",padding:"8px 18px",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer"}}>Analizar →</button>
          </div>
        )}
        {aiLoad&&(
          <div>
            <div style={{height:2,background:"#f3f4f6",borderRadius:2,overflow:"hidden",marginBottom:8}}>
              <div style={{height:"100%",width:"40%",background:"#111",borderRadius:2,animation:"sl 1.2s ease-in-out infinite"}}/>
            </div>
            <div style={{fontSize:12,color:"#9ca3af"}}>Analizando...</div>
          </div>
        )}
        {aiText&&!aiLoad&&(
          <>
            <div style={{fontSize:13,color:"#374151",lineHeight:1.7,whiteSpace:"pre-wrap"}}>{aiText}</div>
            <button onClick={runAI} style={{marginTop:8,fontSize:11,color:"#9ca3af",background:"none",border:"0.5px solid #e5e7eb",borderRadius:6,padding:"3px 10px",cursor:"pointer"}}>↻ Regenerar</button>
          </>
        )}
      </div>

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <div style={{fontSize:11,fontWeight:600,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.5px"}}>
          {{pend:"Pendientes",hoy:"Para hoy",venc:"Vencidas",done:"Completadas",all:"Todas"}[view]} ({list.length})
        </div>
        <button onClick={()=>setView("all")} style={{fontSize:11,color:"#9ca3af",background:"none",border:"none",cursor:"pointer"}}>Ver todas</button>
      </div>

      {loading&&!tasks.length?(
        <div style={{textAlign:"center",padding:"32px 0",color:"#9ca3af",fontSize:13}}>Conectando con tu Sheet...</div>
      ):list.length===0?(
        <div style={{textAlign:"center",padding:"32px 0",color:"#9ca3af",fontSize:13}}>
          <div style={{fontSize:28,marginBottom:8}}>✓</div>Sin tareas aquí
        </div>
      ):list.map(t=>{
        const ov=isOv(t),done2=isDone(t),d=parseD(t.Fecha_Limite);
        const dStr=d?d.toLocaleDateString("es-BO",{day:"2-digit",month:"short"}):"";
        return (
          <div key={t.ID||t.Titulo} style={{background:ov?"#fff5f5":"#fff",border:`0.5px solid ${ov?"#fca5a5":"#e5e7eb"}`,
            borderLeft:`3px solid ${PC[t.Prioridad]?.dot||"#e5e7eb"}`,borderRadius:10,
            padding:"11px 12px",marginBottom:8,display:"flex",gap:10,alignItems:"flex-start",opacity:done2?.45:1}}>
            <div onClick={()=>toggle(t.ID)} style={{width:18,height:18,borderRadius:"50%",
              border:`1.5px solid ${done2?"#22c55e":"#d1d5db"}`,background:done2?"#22c55e":"transparent",
              cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}>
              {done2&&<span style={{color:"#fff",fontSize:10,fontWeight:700}}>✓</span>}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:14,fontWeight:500,color:"#111",textDecoration:done2?"line-through":"none",lineHeight:1.3}}>{t.Titulo}</div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:5,alignItems:"center"}}>
                {t.Categoria&&<span style={{fontSize:10,fontWeight:500,padding:"2px 7px",borderRadius:4,background:"#f3f4f6",color:"#374151"}}>{t.Categoria}</span>}
                {t.Prioridad&&<span style={{fontSize:10,fontWeight:500,padding:"2px 7px",borderRadius:4,background:PC[t.Prioridad]?.bg,color:PC[t.Prioridad]?.c}}>{t.Prioridad}</span>}
                {t.Estado&&<span style={{fontSize:10,fontWeight:500,padding:"2px 7px",borderRadius:4,background:SC[t.Estado]?.bg,color:SC[t.Estado]?.c}}>{t.Estado}</span>}
                {ov&&<span style={{fontSize:10,fontWeight:500,padding:"2px 7px",borderRadius:4,background:"#fef2f2",color:"#b91c1c"}}>Vencida</span>}
                {t.Tiempo_min&&<span style={{fontSize:11,color:"#9ca3af"}}>⏱ {t.Tiempo_min}min</span>}
              </div>
              {t.Notas&&<div style={{fontSize:12,color:"#9ca3af",marginTop:4,lineHeight:1.4}}>{String(t.Notas).slice(0,80)}</div>}
            </div>
            {dStr&&<div style={{fontSize:11,color:ov?"#dc2626":"#9ca3af",flexShrink:0,marginTop:2}}>{dStr}</div>}
          </div>
        );
      })}

      <ChatBar tasks={tasks} onSync={fetchTasks}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
